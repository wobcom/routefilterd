[package]
name = "routefilterd"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.41", features = ["gzip", "tokio"] }
async-stream = "0.3.6"
axum = { version = "0.8", default-features = false, features = ["query", "http1", "tokio"] }
flate2 = "1.1.5"
futures-util = "0.3.31"
http = "1.3.1"
log = "0.4.28"
regex = "1.11.2"
reqwest = { version = "0.13.1", features = ["stream"] }
rpsl-rs = "2.0.1"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "0.9.8"

[dev-dependencies]
const_format = "0.2.36"
stringreader = "0.1.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
